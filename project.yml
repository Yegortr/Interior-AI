name: Reroom
options:
  bundleIdPrefix: com.yegortr
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.20.0

targets:
  Reroom:
    type: application
    platform: iOS
    sources:
      - path: Reroom
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    info:
      path: Reroom/Resources/Info.plist
      properties:
        CFBundleDisplayName: Reroom
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - remote-notification
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Reroom uses the camera to photograph the room or garden you want to redesign.
        NSPhotoLibraryUsageDescription: Reroom lets you pick a photo of the room or garden you want to redesign.
        NSPhotoLibraryAddUsageDescription: Reroom saves your designs to your photo library.
        NSLocationWhenInUseUsageDescription: Reroom uses your approximate location to recommend plants that thrive in your climate.
        SUPABASE_URL: "$(SUPABASE_URL)"
        SUPABASE_ANON_KEY: "$(SUPABASE_ANON_KEY)"
    entitlements:
      path: Reroom/Resources/Reroom.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.$(PRODUCT_BUNDLE_IDENTIFIER)
        com.apple.developer.icloud-services:
          - CloudKit
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yegortr.reroom
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: Supabase
        product: Supabase

  ReroomTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ReroomTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yegortr.reroom.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Reroom

schemes:
  Reroom:
    build:
      targets:
        Reroom: all
        ReroomTests: [test]
    test:
      config: Debug
      targets:
        - ReroomTests
    run:
      config: Debug
    archive:
      config: Release
